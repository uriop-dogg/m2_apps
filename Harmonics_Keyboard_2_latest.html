  filter:hue-rotate(0deg) saturate(2.2)

    drop-shadow(0 0 15px rgba(255,95,230,.32));
  animation:
    shrimpDrift var(--shrimp-drift) linear infinite,
    shrimpHue var(--shrimp-hue) linear infinite,

  animation-delay:var(--shrimp-delay),calc(var(--shrimp-delay) * .31),calc(var(--shrimp-delay) * .17)
}

function gcdBigInt(a,b){
  a=a<0n?-a:a;b=b<0n?-b:b;

function parsePaletteRatioOffset(text){
  const raw=String(text??"").trim();
  if(!raw)return null;
  const m=raw.match(/^([0-9]+)(?:\s*\/\s*([0-9]+))?$/);
  if(!m)return null;

  try{n=BigInt(m[1]);d=m[2]===undefined?1n:BigInt(m[2])}catch{return null}

  return {n,d,ratio:r,cents,label:d===1n?n.toString():`${n.toString()}/${d.toString()}`};
}

function makeMonitorWorker(){const funcs=[hungarianAssignment,monitorMod1,monitorSignedTurnDiff,monitorMinimaxCircularCenter,monitorAssignmentAtReference,monitorEvaluateFixedAssignment,monitorFitAtOddLimit];const source=`const MONITOR_MAX_ODD=63,MONITOR_EXACT_TOLERANCE_CENT=.01;${funcs.map(f=>f.toString()).join('\n')}\nfunction estimate(hs,sign,tolerance,exactFirst){if(!hs.length)return null;const first=Math.max(1,2*hs.length-1);if(exactFirst)for(let L=first;L<=63;L+=2){const f=monitorFitAtOddLimit(hs,sign,L,.01);if(f){f.exact=true;return f}}for(let L=first;L<=63;L+=2){const f=monitorFitAtOddLimit(hs,sign,L,tolerance);if(f){f.exact=f.maxError<=.01;return f}}return null}onmessage=e=>{const {id,hs,tolerance,exact,sign}=e.data;postMessage({id,fit:estimate(hs,sign,tolerance,exact)})}`;const u=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));const w=new Worker(u);URL.revokeObjectURL(u);return w}

function updateMonitor(){const freqs=audioCtx?snapshotFrequencies():[];const hs=monitorPitchClasses(freqs);$('liveNotes').textContent=freqs.length?freqs.map(f=>f.toFixed(2)+' Hz').join(' · '):'—';const key=JSON.stringify([hs,state.tolerance,state.exact]);if(key===lastMonitorKey)return;lastMonitorKey=key;const id=++monitorVersion;if(monitorWorker){monitorWorker.terminate();monitorWorker=null}if(!hs.length){lastFit=null;renderMonitor(null);return}$('monitorMessage').textContent=L('系列を探索中…','Searching series…');const workers=[];const batch={terminate(){workers.forEach(w=>w.terminate())}};monitorWorker=batch;const pair={count:hs.length};let completed=0;const fail=e=>{batch.terminate();if(id!==monitorVersion)return;monitorWorker=null;lastMonitorKey='';$('monitorMessage').textContent=L('モニター探索に失敗しました：','Monitor search failed: ')+(e.message||'worker error')};try{for(const [side,sign]of [['H',1],['S',-1]]){const w=makeMonitorWorker();workers.push(w);w.onmessage=e=>{if(id!==monitorVersion||e.data.id!==id)return;pair[side]=e.data.fit;w.terminate();if(++completed===2){monitorWorker=null;lastFit=pair;renderMonitor(pair)}};w.onerror=fail;w.postMessage({id,hs,sign,tolerance:state.tolerance,exact:state.exact})}}catch(e){fail(e)}}

function updateDial(fit){if(!$('needleH'))$('dial').innerHTML=dialMarkup();for(const k of ['H','S']){const el=$('needle'+k),f=fit?.[k];el.classList.toggle('unavailable',!f);if(!f)continue;const target=monitorMod1(f.reference-.25),prev=needleTurns[k];needleTurns[k]=prev===null?target:prev+monitorSignedTurnDiff(target,monitorMod1(prev));el.style.transform='rotate('+needleTurns[k]*360+'deg)'}}

function updateShrimpUI(){$('shrimpToggle').textContent=state.shrimpEnabled?'ON':'OFF';$('shrimpToggle').classList.toggle('on',state.shrimpEnabled);$('shrimpCountInput').value=state.shrimpCount;$('shrimpCountRange').value=state.shrimpCount;$('shrimpCountReadout').textContent=state.shrimpCount+' / 48'}
function setShrimpCount(v){state.shrimpCount=Math.max(0,Math.min(48,Math.floor(Number(v)||0)));state.shrimpEnabled=state.shrimpCount>0;renderShrimps();save()}
function renderShrimps(){
  const sky=$("shrimpSky");
  if(!sky)return;
  sky.innerHTML="";
  if(!state.shrimpUnlocked||!state.shrimpEnabled||state.shrimpCount<=0){updateShrimpUI();return}
  const count=Math.max(0,Math.min(48,Math.floor(state.shrimpCount)));
  for(let i=0;i<count;i++){
    const el=document.createElement("div");
    el.className="psy-shrimp";
    el.textContent="🦐";
    const top=6+((i*23)%42);
    const size=17+((i*11)%17);
    const drift=18+((i*7)%23);
    const hue=2.8+((i*13)%23)/10;
    const bob=2.2+((i*17)%22)/10;
    const delay=-(i*5.37)%drift;
    const opacity=.30+((i*19)%50)/100;
    el.style.setProperty("--shrimp-top",`${top}px`);
    el.style.setProperty("--shrimp-size",`${size}px`);
    el.style.setProperty("--shrimp-drift",`${drift}s`);
    el.style.setProperty("--shrimp-hue",`${hue}s`);
    el.style.setProperty("--shrimp-bob",`${bob}s`);
    el.style.setProperty("--shrimp-delay",`${delay}s`);
    el.style.setProperty("--shrimp-opacity",String(Math.min(.84,opacity)));
    sky.appendChild(el);
  }
  updateShrimpUI();
}
