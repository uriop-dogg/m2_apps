<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#21121f"><title>ネガレル - Negallel -</title><link rel="stylesheet" href="./style.css"></head>
<body><div id="lights" aria-hidden="true"><i></i><i></i><i></i><i></i></div><main>
<header><span class="eyebrow">NEGATIVE HARMONY</span><h1>ネガレル <span class="latin-title">- Negallel -</span></h1><p>音声のネガティブハーモニーを計算できるサイト</p><label class="theme">光の色 <select id="colorMode"><option value="0">タイプ1 A＝赤</option><option value="90">タイプ2 C＝赤</option></select></label></header>
<div class="console"><label id="dropZone" class="drop-zone"><span class="drop-icon" aria-hidden="true">＋</span><span><strong>音声をドラッグ＆ドロップ</strong><small>またはクリックしてファイルを選択 · MP3 / WAV など</small></span><input id="file" type="file" accept="audio/*,.wav,.mp3,.m4a,.flac,.ogg"></label><p id="fileInfo" class="file-info">音声は端末内で処理します。</p><div class="audio-panel compact-player"><audio id="original" preload="metadata"></audio><audio id="result" preload="metadata"></audio><div class="player-toolbar"><div class="source-tabs" role="group" aria-label="聴き比べる音声"><button id="listenOriginal" aria-pressed="true" disabled>元音声</button><button id="listenResult" aria-pressed="false" disabled>変換後</button></div><div class="audio-downloads"><a id="originalDownload" hidden>元音声を保存</a><a id="download" hidden>変換後を保存</a></div></div><div class="transport"><div class="playback-row"><button id="playPause" class="play-toggle" disabled aria-label="再生">▶ 再生</button><div class="seek-row"><span id="elapsed">0:00</span><input id="seekAudio" type="range" min="0" max="1" step="0.01" value="0" disabled aria-label="再生位置"><span id="duration">0:00</span></div><label class="volume-control">音量<input id="volumeAudio" type="range" min="0" max="1" step="0.01" value="1"></label></div><div class="transport-bottom"><span id="playerStatus" role="status">音声を読み込むと再生できます。</span></div><p id="resultInfo" class="note" hidden></p></div></div><section class="tuning-section"><div class="clock-layout"><div class="base-settings"><h2>基準</h2><div class="grid"><label>オクターブ基準<select id="note"></select></label><label>A4チューニング (Hz)<input id="tuning" type="number" value="440" min="100" max="1000" step="0.01"></label><label>セント値ずれ<input id="cents" type="number" value="0" min="-1200" max="1200" step="any"></label></div>
<p id="frequency" class="note"></p></div><div class="clock-center"><div class="dial" id="dial"><div class="dial-halo" aria-hidden="true"></div><div class="dial-caption" id="dialTitle">反転先の選択</div><div id="ticks" aria-hidden="true"></div><div id="notes" class="notes"></div><div id="position" class="dial-control" role="slider" tabindex="0" aria-label="反転先の選択・時計型メーター" aria-valuemin="0" aria-valuemax="1200" aria-describedby="positionText"><div id="needle" class="needle"><span class="needle-grip"></span></div><span class="hub crystal" aria-hidden="true"></span></div><div id="anchors" class="anchors"></div></div><output id="positionText" class="dial-value"></output></div><div class="ratio-settings"><h2>倍音位置</h2><div class="ratio-controls"><label>整数選択<div class="stepper"><button id="prev" aria-label="前の倍音位置">−</button><input id="integer" aria-label="倍音位置" value="1"><button id="next" aria-label="次の倍音位置">＋</button></div></label><div class="range-field"><label for="ratioMin">表示下限</label><div class="stepper"><button id="ratioMinPrev" aria-label="表示下限を下げる">−</button><input id="ratioMin" value="1"><button id="ratioMinNext" aria-label="表示下限を上げる">＋</button></div></div><div class="range-field"><label for="ratioMax">表示上限</label><div class="stepper"><button id="ratioMaxPrev" aria-label="表示上限を下げる">−</button><input id="ratioMax" value="5"><button id="ratioMaxNext" aria-label="表示上限を上げる">＋</button></div></div><label class="check"><input id="snap" type="checkbox" checked> 倍音位置に吸着</label></div><details><summary>倍音位置の一覧</summary><div id="anchorList"></div></details></div></div></section><section class="processing-section"><div class="method-row"><label>位相推定方式 <select id="method"><option value="gla">Griffin–Lim（従来）</option><option value="fgla" selected>Fast Griffin–Lim（FGLA）</option></select></label><span id="methodHelp">加速係数 0.99 · 少ない反復回数でも比較できます。</span></div><div class="processing-grid"><label>窓長 (FFT)<select id="window"><option>4096</option><option>8192</option><option>16384</option><option>32768</option></select></label><label>ホップ長<input id="hop" type="number" value="1024" min="1" step="1"></label><label>反復回数<input id="iterations" type="number" value="32" min="1" max="256" step="1"></label><div class="actions"><button id="run" class="primary" disabled>変換する</button><button id="stop" disabled>停止</button></div></div><p id="estimate" class="note">長い音源・大きな窓長では、処理に時間がかかります。</p><progress id="progress" max="1" value="0"></progress><p id="status" role="status" aria-live="polite">音声ファイルを選択してください。</p></section><p id="backgroundStatus" class="note background-status"></p></div><footer>音声のアップロード・外部サービスへの送信は行いません。<br><a href="./README.md">使い方・公開方法・処理の仕様</a></footer></main><script src="./glow.js" defer></script><script src="./app.js" defer></script><script src="./player.js" defer></script></body></html>
